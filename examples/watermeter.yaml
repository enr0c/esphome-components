substitutions:
  name: "watermeter"
  friendly_name: watermeter

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # Replace the placeholder meter IDs, names and keys with your own.
  devices:
    - id: lorenz_11111111_device
      name: "Water meter 1"
    - id: lorenz_22222222_device
      name: "Cold water 2 22222222"
    - id: lorenz_33333333_device
      name: "Cold water 3 33333333"
    - id: lorenz_44444444_device
      name: "Hot water 4 44444444"
    - id: lorenz_55555555_device
      name: "Hot water 5 55555555"
    - id: engelmann_66666666_device
      name: "Underfloor heating 66666666"

esp32:
  board: esp32dev
  toolchain: esp-idf
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 16384
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  level: INFO  # Set to DEBUG only to capture frame hex dumps (uses much more heap and log bandwidth)
  tx_buffer_size: 2048
  baud_rate: 115200
  logs:
    component: INFO
    esp32: INFO
    spi: INFO
    app: INFO
    wifi: INFO
    wmbus_radio: INFO
    cc1101: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE          # Disable WiFi power saving for stability
  fast_connect: true             # Skip scanning, connect directly
  reboot_timeout: 5min

  # Fallback hotspot in case wifi connection fails
  ap:
    ssid: "portal_${friendly_name}"
    password: !secret esphome_ap_password

time:
  - platform: homeassistant

button:
  - platform: restart
    id: "restart_button"
    name: "restart_${friendly_name}"

external_components:
  - source: github://enr0c/esphome-components@main
    components: [ wmbus_radio, wmbus_meter, wmbus_common ]
    refresh: 0min

# Wiring:
# VCC   -> 3.3V
# GND   -> GND
# MOSI  -> GPIO19
# S/CLK -> GPIO18
# MISO  -> GPIO23
# GDO2  -> GPIO27
# GDO0  -> GPIO26
# CSN   -> GPIO25

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19
  miso_pin: GPIO23

wmbus_radio:
  id: radio
  radio_type: CC1101
  cs_pin: GPIO25
  gdo2_pin:
    number: GPIO27
    mode: INPUT_PULLDOWN
  gdo0_pin: GPIO26
  frequency: 868.95
  on_frame:
    - then:
        - logger.log:
            level: DEBUG
            format: "RSSI: %ddBm T: %s (%d) %s"
            args: [ frame->rssi(), frame->as_hex().c_str(), frame->data().size(), toString(frame->link_mode()) ]

wmbus_common:
  drivers:
    - waterstarm
    - sensostar

wmbus_meter:
  - id: lorenz_11111111
    radio_id: radio
    meter_id: 0x11111111
    type: waterstarm
    key: !secret lorenz_11111111
    on_telegram:
      then:
        - logger.log:
            level: INFO
            format: "wmbus %s: %s"
            args:
              - meter.get_id().c_str()
              - meter.as_json(false).c_str()
  - id: lorenz_22222222
    radio_id: radio
    meter_id: 0x22222222
    type: waterstarm
